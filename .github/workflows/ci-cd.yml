name: CI/CD

# Cevovod se sproži ob vsakem pull requestu v main in ob vsakem pushu na main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cevovod samo bere repozitorij.
permissions:
  contents: read

# Ob novem pushu v pull request prekliči prejšnji, še nedokončan zagon. Zagoni na main se ne
# prekinjajo, ampak čakajo v vrsti, da se namestitev ne ustavi na pol.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: '25'
  NODE_VERSION: '24'
  BACKEND_DIR: backend/delavnica-api
  FRONTEND_DIR: frontend/delavnica-web

jobs:
  # 2.2 Slog in kakovost kode: Checkstyle (backend) in ESLint (frontend). Ob napaki job pade.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Prevzem kode
        uses: actions/checkout@v7

      - name: Namesti Javo
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: ${{ env.BACKEND_DIR }}/pom.xml

      - name: Backend - Checkstyle
        working-directory: ${{ env.BACKEND_DIR }}
        run: ./mvnw -B checkstyle:check

      - name: Namesti Node.js
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      # frontend se preveri tudi, če je backend padel, da sta vidni obe poročili
      - name: Frontend - namesti odvisnosti
        if: ${{ !cancelled() }}
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Frontend - ESLint
        if: ${{ !cancelled() }}
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run lint

  # 2.3 Gradnja: backend jar in frontend dist. Odvisnosti (~/.m2 in npm) so predpomnjene,
  # rezultati gradnje se shranijo kot artefakta za namestitev.
  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Prevzem kode
        uses: actions/checkout@v7

      - name: Namesti Javo (predpomnilnik ~/.m2)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: ${{ env.BACKEND_DIR }}/pom.xml

      - name: Backend - gradnja jar
        working-directory: ${{ env.BACKEND_DIR }}
        run: ./mvnw -B -DskipTests package

      - name: Backend - shrani jar
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: ${{ env.BACKEND_DIR }}/target/*.jar
          if-no-files-found: error

      - name: Namesti Node.js (predpomnilnik npm)
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Frontend - namesti odvisnosti
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Frontend - gradnja
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build

      - name: Frontend - shrani dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: ${{ env.FRONTEND_DIR }}/dist/delavnica-web/browser
          if-no-files-found: error

  # 2.4 Testi: JUnit + JaCoCo (backend) in Vitest + v8 (frontend). Če pade kateri koli test, pade job
  # in s tem cevovod. Poročili o pokritosti se shranita kot artefakta (tudi ob padlih testih).
  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Prevzem kode
        uses: actions/checkout@v7

      - name: Namesti Javo (predpomnilnik ~/.m2)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: ${{ env.BACKEND_DIR }}/pom.xml

      # integracijski testi uporabljajo H2 v pomnilniku (profil "test"), zunanja baza ni potrebna
      - name: Backend - testi in pokritost (JaCoCo)
        working-directory: ${{ env.BACKEND_DIR }}
        run: ./mvnw -B test

      - name: Backend - shrani poročilo o pokritosti
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-pokritost
          path: ${{ env.BACKEND_DIR }}/target/site/jacoco
          if-no-files-found: warn

      - name: Namesti Node.js (predpomnilnik npm)
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Frontend - namesti odvisnosti
        if: ${{ !cancelled() }}
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Frontend - testi in pokritost (Vitest)
        if: ${{ !cancelled() }}
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run test:ci

      - name: Frontend - shrani poročilo o pokritosti
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-pokritost
          path: ${{ env.FRONTEND_DIR }}/coverage
          if-no-files-found: warn

  # 2.5 Namestitev: samo ob pushu na main in samo, če so lint, build in test uspeli.
  # Uporabi artefakta iz joba build, aplikacije ne gradi ponovno.
  #   backend  -> Render (jar se zapakira v sliko z JRE, slika gre na GHCR), baza je CockroachDB Cloud
  #   frontend -> Cloudflare Pages
  # Okolje production hrani skrivnosti (RENDER_DEPLOY_HOOK_URL, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID)
  # in spremenljivke (API_URL, FRONTEND_URL, CLOUDFLARE_PAGES_PROJECT).
  deploy:
    name: Deploy
    needs: [lint, build, test]
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.FRONTEND_URL }}
    permissions:
      contents: read
      packages: write # objava slike backenda na GHCR
    steps:
      - name: Prevzem Dockerfila za namestitev
        uses: actions/checkout@v7
        with:
          sparse-checkout: deploy

      - name: Prenesi backend jar
        uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: artefakti/backend

      - name: Prenesi frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: artefakti/frontend

      # Slika vsebuje samo JRE in jar iz joba build. Ime slike mora biti z malimi črkami.
      - name: Backend - objavi sliko na GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          slika="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/delavnica-api"
          echo "SLIKA=$slika" >> "$GITHUB_ENV"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -f deploy/backend.Dockerfile \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$slika:$GITHUB_SHA" -t "$slika:latest" artefakti/backend
          docker push --all-tags "$slika"

      # Ob prvem zagonu storitev na Renderju še ne obstaja (Render jo ustvari iz že objavljene slike).
      - name: Preveri nastavitve okolja production
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_URL: ${{ vars.API_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          manjka=0
          for ime in RENDER_DEPLOY_HOOK_URL CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID API_URL FRONTEND_URL CLOUDFLARE_PAGES_PROJECT; do
            if [[ -z "${!ime}" ]]; then
              echo "::error::V okolju production manjka $ime."
              manjka=1
            fi
          done
          if [[ "$manjka" == 1 ]]; then
            echo "::notice::Slika backenda je objavljena: $SLIKA:latest. Iz nje ustvari storitev na Renderju, dopolni okolje production in ponovno zaženi job."
            exit 1
          fi
          for ime in API_URL FRONTEND_URL; do
            if [[ "${!ime}" != https://* ]]; then
              echo "::error::$ime mora biti URL, ki se začne s https://."
              exit 1
            fi
          done

      - name: Backend - namesti na Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error -X POST --url-query "imgURL=$SLIKA:$GITHUB_SHA" "$RENDER_DEPLOY_HOOK_URL"

      # Frontend prebere URL backenda ob zagonu iz env.js, zato ga ni treba ponovno graditi.
      - name: Frontend - nastavi URL backenda
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          printf "window.env = { apiUrl: '%s' };\n" "${API_URL%/}" > artefakti/frontend/env.js
          cat artefakti/frontend/env.js

      - name: Namesti Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Frontend - namesti na Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJEKT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          # projekt ustvari ob prvi namestitvi
          stanje=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJEKT")
          if [[ "$stanje" == 404 ]]; then
            npx --yes wrangler@4.166.0 pages project create "$PROJEKT" --production-branch=main
          fi
          npx --yes wrangler@4.166.0 pages deploy artefakti/frontend --project-name="$PROJEKT" --branch=main --commit-hash="$GITHUB_SHA" --commit-dirty=true

      # Render po namestitvi sliko prenese in zažene, na brezplačni instanci traja zagon nekaj minut.
      - name: Preveri, da sta aplikaciji dosegljivi
        env:
          API_URL: ${{ vars.API_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          API_URL="${API_URL%/}"
          FRONTEND_URL="${FRONTEND_URL%/}"
          poskusi=(--fail --silent --show-error --retry 30 --retry-delay 10 --retry-all-errors --max-time 60)
          curl "${poskusi[@]}" -o /dev/null "$API_URL/v3/api-docs"
          echo "Backend je dosegljiv: $API_URL"
          curl "${poskusi[@]}" -o namescen-env.js "$FRONTEND_URL/env.js"
          grep -qF "$API_URL" namescen-env.js
          echo "Frontend je dosegljiv in kaže na backend: $FRONTEND_URL"
          # CORS: backend mora dovoliti klice z domene frontenda (CORS_ORIGINS na Renderju)
          curl "${poskusi[@]}" -o /dev/null -X OPTIONS \
            -H "Origin: $FRONTEND_URL" -H "Access-Control-Request-Method: GET" "$API_URL/api/nalogi"
          echo "Backend sprejema zahteve s frontenda (CORS)."
